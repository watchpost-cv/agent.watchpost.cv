<main class="auth-shell" data-launcher data-default-host="localhost" data-default-port="7335">
  <form class="auth-card" data-config novalidate>
    <div class="auth-brand"><span class="brand-mark" aria-hidden="true">W</span><strong>Watchpost Agent</strong></div>
    <h1>Watchpost Agent</h1>
    <div class="auth-error" data-error role="alert" hidden></div>
    <label>Domain or IP<input name="host" value="localhost" placeholder="localhost or https://agent.example.com" autocomplete="url" spellcheck="false"></label>
    <label>Port<input name="port" type="number" min="1" max="65535" value="7335" inputmode="numeric"></label>
    <div class="actions"><button type="submit">Save</button><button type="button" class="secondary" data-defaults>Use defaults</button></div>
    <button type="button" class="secondary open" data-open>Open Watchpost Agent</button>
  </form>
</main>
